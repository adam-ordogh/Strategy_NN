behaviors:
  AIMacroML:
    trainer_type: ppo
    
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 1.5e-4  # Half of original
      beta: 3.0e-4  # Slightly lower entropy
      epsilon: 0.2
      lambd: 0.99
      num_epoch: 4
      learning_rate_schedule: linear
    
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    
    checkpoint_interval: 50000
    keep_checkpoints: 5
    max_steps: 2000000
    time_horizon: 256
    summary_freq: 5000
    
    self_play:
      save_steps: 20000
      team_change: 99999999  
      # swap_steps: 10000
      swap_steps: 5000        
      # window: 10
      window: 20
      play_against_current_self_ratio: 0.5
      initial_elo: 1200.0